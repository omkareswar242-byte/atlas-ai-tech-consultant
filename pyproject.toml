[project]
name = "ai-tech-consultant"
version = "0.1.0"
description = "A beginner-friendly Python MVP for the AI Tech Consultant capstone"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "anthropic>=0.40,<1",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
